<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Simple Machines Lab — explore lever, wheel & axle, pulley, inclined plane, wedge, and screw with clear touch-friendly experiments.">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Simple Machines Lab — The Token Moose</title>
  <link rel="stylesheet" href="css/game.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="pwa-install.css">
</head>
<body data-app-id="simple-machines" data-app-title="Simple Machines Lab">
  <div id="app">
    <!-- LAB HOME -->
    <section id="view-lab" class="view">
      <header class="lab-head">
        <h1>Simple Machines Lab</h1>
        <p class="tag">Choose a station · try it · see what happens</p>
        <p class="progress" id="lab-progress">Machines explored: 0 / 6</p>
        <button type="button" class="btn btn-ghost" id="btn-show-expert" hidden>🏆 Expert badge</button>
      </header>
      <div class="station-grid" id="station-grid"></div>
      <p class="foot-hint">Each machine is a short experiment. Drag, push, or tap the big controls.</p>
    </section>

    <!-- EXPERIMENT -->
    <section id="view-experiment" class="view" hidden>
      <div class="exp-bar">
        <button type="button" class="btn btn-ghost" id="btn-back-lab">← Lab</button>
        <h2 id="exp-title"></h2>
        <button type="button" class="btn btn-ghost" id="btn-reset-exp">Reset</button>
      </div>
      <p class="exp-hint" id="exp-hint"></p>
      <div class="exp-stage" id="exp-stage"></div>
      <p class="exp-lesson" id="exp-lesson"></p>
    </section>

    <!-- SUCCESS -->
    <section id="view-success" class="view" hidden>
      <div class="panel success-panel">
        <h2 id="success-title">Well done!</h2>
        <p class="lesson-line" id="success-lesson"></p>
        <p class="progress" id="success-progress"></p>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="btn-success-again">Try again</button>
          <button type="button" class="btn btn-primary" id="btn-success-next">Next machine</button>
          <button type="button" class="btn btn-ghost" id="btn-success-lab">Back to Lab</button>
        </div>
      </div>
    </section>

    <!-- EXPERT -->
    <section id="view-expert" class="view" hidden>
      <div class="panel success-panel">
        <h2>🌟 Simple Machines Expert!</h2>
        <p class="lesson-line">You explored all six simple machines.</p>
        <ul id="expert-list" class="expert-list"></ul>
        <button type="button" class="btn btn-primary" id="btn-expert-lab">Back to Lab</button>
      </div>
    </section>
  </div>

  <script src="../../js/app-chrome.js"></script>
  <script src="js/game.js"></script>
  <script src="pwa-install.js"></script>
</body>
</html>
