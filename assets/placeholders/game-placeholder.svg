<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225" role="img" aria-label="Game placeholder">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#12162e"/>
      <stop offset="50%" style="stop-color:#1a1f3a"/>
      <stop offset="100%" style="stop-color:#0f1229"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4d9e"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg)"/>
  <!-- Subtle city skyline silhouette -->
  <g fill="#1e2448" opacity="0.9">
    <rect x="20" y="120" width="30" height="105"/>
    <rect x="55" y="90" width="22" height="135"/>
    <rect x="85" y="140" width="40" height="85"/>
    <rect x="135" y="70" width="28" height="155"/>
    <rect x="170" y="110" width="35" height="115"/>
    <rect x="215" y="50" width="25" height="175"/>
    <rect x="250" y="100" width="45" height="125"/>
    <rect x="305" y="80" width="30" height="145"/>
    <rect x="345" y="130" width="35" height="95"/>
  </g>
  <!-- Neon windows -->
  <g fill="#22d3ee" opacity="0.35">
    <rect x="25" y="130" width="6" height="6"/><rect x="35" y="130" width="6" height="6"/>
    <rect x="25" y="145" width="6" height="6"/><rect x="35" y="160" width="6" height="6"/>
    <rect x="60" y="100" width="5" height="5"/><rect x="68" y="115" width="5" height="5"/>
    <rect x="140" y="85" width="6" height="6"/><rect x="150" y="100" width="6" height="6"/>
    <rect x="220" y="65" width="5" height="5"/><rect x="228" y="80" width="5" height="5"/>
    <rect x="260" y="115" width="6" height="6"/><rect x="275" y="130" width="6" height="6"/>
  </g>
  <g fill="#ff4d9e" opacity="0.3">
    <rect x="90" y="155" width="6" height="6"/><rect x="100" y="170" width="6" height="6"/>
    <rect x="175" y="125" width="5" height="5"/><rect x="185" y="140" width="5" height="5"/>
    <rect x="310" y="95" width="6" height="6"/><rect x="320" y="110" width="6" height="6"/>
  </g>
  <!-- Center label -->
  <rect x="100" y="85" width="200" height="55" rx="10" fill="rgba(15,18,41,0.75)" stroke="url(#neon)" stroke-width="1.5"/>
  <text x="200" y="120" text-anchor="middle" fill="#f9a8d4" font-family="system-ui,sans-serif" font-size="18" font-weight="700">GAME PLACEHOLDER</text>
</svg>
