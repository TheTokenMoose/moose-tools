<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browser games from The Token Moose — playable, installable, and open source.">
  <meta name="theme-color" content="#0a0b1a">
  <title>Games — The Token Moose</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/icons/favicon-180.png">
<link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="games">
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand" aria-label="The Token Moose home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>THE TOKEN MOOSE</span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav">
        <span></span>
      </button>
      <nav id="main-nav" class="main-nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="games.html" aria-current="page">Games</a>
        <a href="tools.html">Tools</a>
        <a href="favorites.html">Favorites</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <section aria-labelledby="games-heading">
      <div class="section-header">
        <div>
          <h2 id="games-heading">Games</h2>
          <p class="page-intro">Browser games you can play instantly or install as apps where your browser supports it.</p>
        </div>
      </div>

      <div class="toolbar">
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <label for="search-input" class="sr-only">Search games</label>
          <input type="search" id="search-input" placeholder="Search games…" autocomplete="off">
        </div>
        <div class="filter-group" role="group" aria-label="Filter">
          <button type="button" class="filter-btn is-active" data-filter="games" aria-pressed="true">All Games</button>
          <button type="button" class="filter-btn" data-filter="favorites" aria-pressed="false">Favorites</button>
        </div>
      </div>

      <div id="project-grid" class="project-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>The Token Moose · Open source · Made for learning and play</p>
  </footer>

  <script src="js/projects.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/install.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sw-register.js"></script>
</body>
</html>
