<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Voice settings for The Token Moose — test, save, disable, and manage classroom voices.">
  <meta name="theme-color" content="#0a0b1a">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Voices — Moose Tools</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/tts-settings.css">
  <script>
    try {
      var t = localStorage.getItem("token-moose-theme");
      if (t === "day" || t === "playful" || t === "night" || t === "forest" || t === "ocean") document.documentElement.setAttribute("data-theme", t);
      var p = localStorage.getItem("token-moose-projector");
      document.documentElement.setAttribute("data-projector", p === "on" ? "on" : "off");
    } catch (e) {}
  </script>
</head>
<body data-page="voices">
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand" aria-label="The Token Moose home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>THE TOKEN MOOSE</span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav"><span></span></button>
      <nav id="main-nav" class="main-nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="tools.html">Tools</a>
        <a href="favorites.html">Favorites</a>
        <a href="voice-settings.html" aria-current="page">Voices</a>
        <a href="about.html">About</a>
      </nav>
      <div class="theme-switcher"></div>
    </div>
  </header>
  <main class="site-main">
    <div id="moose-tts-settings"></div>
  </main>
  <footer class="site-footer">
    <p>Defaults apply across games · In-game voice menu still available</p>
  </footer>
  <script src="js/theme.js"></script>
  <script src="js/tts/voice-catalog.js"></script>
  <script src="js/tts/moose-tts.js"></script>
  <script src="js/tts/tts-settings.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sw-register.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.MooseTTSSettings) MooseTTSSettings.mount("#moose-tts-settings");
    });
  </script>
</body>
</html>
