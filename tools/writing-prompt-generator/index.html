<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7c3aed">
  <meta name="description" content="Writing Prompt Generator — levelled prompts, starters, vocabulary, and challenges for K–primary ESL.">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Writing Prompt Generator — The Token Moose</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="pwa-install.css">
</head>
<body data-app-id="writing-prompt-generator" data-app-title="Writing Prompt Generator">
  <div id="app">
    <header class="head">
      <h1>Writing Prompt Generator</h1>
      <p class="tag">Every idea starts with a spark</p>
    </header>

    <section class="controls no-print">
      <label>Genre
        <select id="sel-genre"></select>
      </label>
      <label>Level
        <select id="sel-level"></select>
      </label>
      <label>Topic
        <select id="sel-topic"></select>
      </label>
      <label id="custom-wrap" hidden>Custom topic
        <input type="text" id="custom-topic" placeholder="e.g. dinosaurs" />
      </label>
      <button type="button" class="btn btn-primary" id="btn-generate">Generate activity</button>
    </section>

    <article class="card" id="card" hidden>
      <p class="meta" id="out-meta"></p>
      <h2 class="prompt" id="out-prompt"></h2>

      <div class="section">
        <div class="sec-head">
          <h3>Sentence starters</h3>
          <button type="button" class="btn-tiny no-print" id="btn-regen-starters">↻</button>
        </div>
        <ul id="out-starters"></ul>
      </div>

      <div class="section">
        <div class="sec-head">
          <h3>Useful vocabulary</h3>
          <button type="button" class="btn-tiny no-print" id="btn-regen-vocab">↻</button>
        </div>
        <div class="vocab" id="out-vocab"></div>
      </div>

      <div class="section two">
        <div>
          <div class="sec-head">
            <h3>Challenge</h3>
            <button type="button" class="btn-tiny no-print" id="btn-regen-challenge">↻</button>
          </div>
          <p id="out-challenge"></p>
        </div>
        <div>
          <h3>Drawing</h3>
          <p id="out-draw"></p>
        </div>
      </div>

      <div class="actions no-print">
        <button type="button" class="btn btn-primary" id="btn-regen-prompt">New prompt</button>
        <button type="button" class="btn btn-ghost" id="btn-copy">Copy</button>
        <button type="button" class="btn btn-ghost" id="btn-print">Print</button>
        <button type="button" class="btn btn-ghost" id="btn-fav">★ Favourite</button>
        <span id="status" class="status"></span>
      </div>
    </article>

    <section class="favs no-print">
      <h3>Favourites</h3>
      <div id="fav-list"></div>
    </section>
  </div>

  <script src="js/bank.js"></script>
  <script src="../../js/app-chrome.js"></script>
  <script src="js/app.js"></script>
  <script src="pwa-install.js"></script>
</body>
</html>
