<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9a3412">
  <meta name="description" content="Bingo Maker — build classroom bingo boards and call items at random.">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Bingo Maker — The Token Moose</title>
  <link rel="stylesheet" href="../../css/themes.css">
  <link rel="stylesheet" href="../../css/theme-app.css">
  <link rel="stylesheet" href="css/tool.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="pwa-install.css">
  <script>
    try {
      var t = localStorage.getItem("token-moose-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
      var p = localStorage.getItem("token-moose-projector");
      document.documentElement.setAttribute("data-projector", p === "on" ? "on" : "off");
    } catch (e) {}
  </script>
</head>
<body class="theme-bridged" data-app-id="bingo-maker" data-app-title="Bingo Maker">
  <div id="app">
    <header class="head">
      <h1>Bingo Maker</h1>
      <p class="sub">Word / picture prompts · unique boards · caller mode</p>
    </header>

    <section class="panel">
      <label for="items">Bingo items (comma-separated, need at least 24)</label>
      <textarea id="items" rows="5" placeholder="cat, dog, sun, run, jump, red, blue…"></textarea>
      <div class="row">
        <label for="board-count">Boards</label>
        <input type="number" id="board-count" min="1" max="30" value="6">
        <label class="check"><input type="checkbox" id="free-center" checked> FREE centre</label>
      </div>
      <div class="actions">
        <button type="button" class="btn primary" id="btn-gen">Generate boards</button>
        <button type="button" class="btn" id="btn-print">Print</button>
        <button type="button" class="btn" id="btn-caller">Caller mode</button>
      </div>
    </section>

    <div id="boards" class="boards"></div>
  </div>

  <div id="caller" class="caller" hidden>
    <div class="caller-bar">
      <strong>Caller</strong>
      <button type="button" class="btn primary" id="btn-call">Call next</button>
      <button type="button" class="btn" id="btn-caller-reset">Reset calls</button>
      <button type="button" class="btn" id="btn-caller-exit">Exit</button>
    </div>
    <div class="called-now" id="called-now">—</div>
    <div class="called-list" id="called-list"></div>
  </div>

  <script src="../../js/app-chrome.js"></script>
  <script src="js/app.js"></script>
  <script src="pwa-install.js"></script>
</body>
</html>
