<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1033">
  <meta name="description" content="Name Spin Wheel — classroom random name picker with standard and remove modes.">
  <title>Name Spin Wheel — The Token Moose</title>
  <link rel="icon" href="../../assets/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png">

  <link rel="stylesheet" href="../../css/themes.css">
  <link rel="stylesheet" href="../../css/theme-app.css">
  <link rel="stylesheet" href="css/tool.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="pwa-install.css">
  <style id="cover-bg-style">
.library-back { position: relative; z-index: 20; margin: 12px 16px 0; }
.library-back .btn-back {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.55rem 1rem;
  border-radius: 999px;
  border: 2px solid rgba(255,255,255,0.25);
  background: rgba(15, 18, 40, 0.75);
  color: #fff;
  font: inherit;
  font-weight: 800;
  font-size: 0.9rem;
  text-decoration: none;
  cursor: pointer;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  transition: transform 0.15s ease, background 0.15s ease;
}
.library-back .btn-back:hover {
  transform: translateY(-1px);
  background: rgba(30, 36, 70, 0.9);
  color: #fff;
}
.library-back .btn-back:focus-visible {
  outline: 2px solid #22d3ee;
  outline-offset: 2px;
}

    /* Cover art page background */
    body {
      background-color: #0a0b1a;
      background-image:
        linear-gradient(180deg, rgba(8, 10, 24, 0.55) 0%, rgba(8, 10, 24, 0.78) 45%, rgba(8, 10, 24, 0.92) 100%),
        url("../../assets/screenshots/name-spin-wheel.jpg");
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>
<body data-app-id="name-spin-wheel" data-app-title="Name Spin Wheel">
  <p class="library-back"><a class="btn-back" href="../../index.html">← Back to The Token Moose</a></p>

  <header class="tool-header">
    <h1>🎡 Name Spin Wheel</h1>
    <button type="button" id="mute-btn" class="btn-mute" aria-label="Mute music">🔊 Music</button>
  </header>

  <section class="panel">
    <label for="name-input">Student names (comma-separated)</label>
    <textarea id="name-input" rows="3" placeholder="Jayden, Harry, John B, Mia, Lucas">Jayden, Harry, John B, Mia, Lucas, Ava, Noah, Sophia</textarea>
    <div class="panel-row">
      <button type="button" id="load-btn" class="btn-primary">Load names onto wheel</button>
      <span class="mode-label">Mode:</span>
      <label class="radio"><input type="radio" name="mode" value="standard" checked> Standard (keep names)</label>
      <label class="radio"><input type="radio" name="mode" value="remove"> Spin &amp; remove</label>
    </div>
  </section>

  <div class="main">
    <canvas id="wheel" width="480" height="480" aria-label="Name spin wheel"></canvas>
    <div class="side">
      <p id="result" class="result">Load names, then spin!</p>
      <p id="count" class="count"></p>
      <button type="button" id="spin-btn" class="btn-spin">SPIN</button>
      <button type="button" id="reset-btn" class="btn-secondary">Reset removed names</button>
      <p class="tip">Tip: “John B” stays one name. Comma separates students.</p>
    </div>
  </div>

  <div id="pwa-install-bar" hidden>
    <div class="pwa-install-text">
      <strong>Install Name Spin Wheel</strong>
      <span>Add this app to your device for offline use.</span>
    </div>
    <button type="button" id="pwa-install-btn">Install</button>
    <button type="button" id="pwa-install-dismiss" aria-label="Dismiss">×</button>
  </div>

  <script src="js/tool.js"></script>
  <script src="pwa-install.js"></script>
  <script src="../../js/app-chrome.js"></script>
</body>
</html>
