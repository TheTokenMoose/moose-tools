<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b21b6">
  <meta name="description" content="Flashcard Maker — create front/back cards, flip practice, print.">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Flashcard Maker — The Token Moose</title>
  <link rel="icon" href="../../assets/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png">

  <link rel="stylesheet" href="../../css/themes.css">
  <link rel="stylesheet" href="../../css/theme-app.css">
  <link rel="stylesheet" href="css/tool.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="pwa-install.css">
  <script>
    try {
      var t = localStorage.getItem("token-moose-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
      var p = localStorage.getItem("token-moose-projector");
      document.documentElement.setAttribute("data-projector", p === "on" ? "on" : "off");
    } catch (e) {}
  </script>
</head>
<body class="theme-bridged" data-app-id="flashcard-maker" data-app-title="Flashcard Maker">
  <div id="app">
    <header class="head">
      <h1>Flashcard Maker</h1>
      <p class="sub">One pair per line: front, back</p>
    </header>

    <section class="panel" id="main-panel">
      <label for="deck">Cards</label>
      <textarea id="deck" rows="8" placeholder="cat, a small animal
sun, star in the day
… (front, back per line)"></textarea>
      <div class="actions">
        <button type="button" class="btn primary" id="btn-save">Save deck (.txt)</button>
        <button type="button" class="btn" id="btn-import">Import deck</button>
        <input type="file" id="import-file" accept=".txt,text/plain" hidden>
        <button type="button" class="btn" id="btn-practice">Practice</button>
        <button type="button" class="btn" id="btn-shuffle">Shuffle</button>
        <button type="button" class="btn" id="btn-print-setup">Print options</button>
      </div>
    </section>

    <!-- Print customisation -->
    <section class="panel print-setup" id="print-setup" hidden>
      <h2 class="panel-title">Print options</h2>
      <div class="print-controls">
        <label class="ctrl">Layout (A4)
          <select id="print-layout">
            <option value="2x5">2 × 5 (10 per page)</option>
            <option value="2x3" selected>2 × 3 (6 per page)</option>
            <option value="2x2">2 × 2 (4 per page)</option>
          </select>
        </label>
        <label class="ctrl">Theme
          <select id="print-theme">
            <option value="custom">Custom</option>
            <option value="classic">Classic</option>
            <option value="ocean">Ocean</option>
            <option value="sunshine">Sunshine</option>
            <option value="forest">Forest</option>
            <option value="candy">Candy</option>
          </select>
        </label>
        <label class="ctrl">Text size
          <input type="range" id="print-text-size" min="10" max="96" value="18">
          <span id="print-text-size-label">18px</span>
        </label>
        <label class="ctrl">Border weight
          <input type="range" id="print-border" min="1" max="24" value="2">
          <span id="print-border-label">2px</span>
        </label>
        <label class="ctrl rotate-ctrl">
          <span class="ctrl-row">
            <input type="checkbox" id="print-rotate">
            Rotate text 90°
          </span>
        </label>
        <label class="ctrl">Font colour
          <input type="color" id="print-font" value="#111111">
        </label>
        <label class="ctrl">Background
          <input type="color" id="print-bg" value="#ffffff">
        </label>
        <label class="ctrl">Border colour
          <input type="color" id="print-border-color" value="#222222">
        </label>
      </div>

      <div class="preview-block">
        <p class="preview-label">Preview</p>
        <div class="print-preview-wrap">
          <div class="print-preview-card layout-2x3" id="print-preview">
            <div class="print-face" id="print-preview-text">Sample word</div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn primary" id="btn-print-go">Print</button>
        <button type="button" class="btn" id="btn-print-cancel">Back</button>
      </div>
    </section>

    <div id="print-area" class="print-area" hidden></div>
  </div>

  <div id="practice" class="practice" hidden>
    <div class="prac-bar">
      <span id="prog">1 / 1</span>
      <button type="button" class="btn solid" id="btn-exit">Exit</button>
    </div>
    <button type="button" class="flip-card" id="flip-card" aria-label="Flip card">
      <span class="side" id="card-text">—</span>
      <span class="hint">Tap to flip</span>
    </button>
    <div class="prac-nav">
      <button type="button" class="btn solid" id="btn-prev">← Prev</button>
      <button type="button" class="btn primary" id="btn-next">Next →</button>
    </div>
  </div>

  <script src="../../js/app-chrome.js"></script>
  <script src="js/app.js"></script>
  <script src="pwa-install.js"></script>
</body>
</html>
