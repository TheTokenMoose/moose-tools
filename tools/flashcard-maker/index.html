<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b21b6">
  <meta name="description" content="Flashcard Maker — create front/back cards, flip practice, print.">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Flashcard Maker — The Token Moose</title>
  <link rel="stylesheet" href="../../css/themes.css">
  <link rel="stylesheet" href="../../css/theme-app.css">
  <link rel="stylesheet" href="css/tool.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="pwa-install.css">
  <script>
    try {
      var t = localStorage.getItem("token-moose-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
      var p = localStorage.getItem("token-moose-projector");
      document.documentElement.setAttribute("data-projector", p === "on" ? "on" : "off");
    } catch (e) {}
  </script>
</head>
<body class="theme-bridged" data-app-id="flashcard-maker" data-app-title="Flashcard Maker">
  <div id="app">
    <header class="head">
      <h1>Flashcard Maker</h1>
      <p class="sub">One pair per line: front | back</p>
    </header>

    <section class="panel">
      <label for="deck">Cards</label>
      <textarea id="deck" rows="8" placeholder="cat | 猫&#10;dog | 狗&#10;2+2 | 4"></textarea>
      <div class="actions">
        <button type="button" class="btn primary" id="btn-save">Save deck</button>
        <button type="button" class="btn" id="btn-practice">Practice</button>
        <button type="button" class="btn" id="btn-print">Print</button>
        <button type="button" class="btn" id="btn-shuffle">Shuffle</button>
      </div>
    </section>

    <div id="print-area" class="print-area" hidden></div>
  </div>

  <div id="practice" class="practice" hidden>
    <div class="prac-bar">
      <span id="prog">1 / 1</span>
      <button type="button" class="btn" id="btn-exit">Exit</button>
    </div>
    <button type="button" class="flip-card" id="flip-card" aria-label="Flip card">
      <span class="side" id="card-text">—</span>
      <span class="hint">Tap to flip</span>
    </button>
    <div class="prac-nav">
      <button type="button" class="btn" id="btn-prev">← Prev</button>
      <button type="button" class="btn primary" id="btn-next">Next →</button>
    </div>
  </div>

  <script src="../../js/app-chrome.js"></script>
  <script src="js/app.js"></script>
  <script src="pwa-install.js"></script>
</body>
</html>
