<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="description" content="Word Wall Maker — build a classroom word wall, display full screen, print.">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Word Wall Maker — The Token Moose</title>
  <link rel="icon" href="../../assets/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png">

  <link rel="stylesheet" href="../../css/themes.css">
  <link rel="stylesheet" href="../../css/theme-app.css">
  <link rel="stylesheet" href="css/tool.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="pwa-install.css">
  <script>
    try {
      var t = localStorage.getItem("token-moose-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
      var p = localStorage.getItem("token-moose-projector");
      document.documentElement.setAttribute("data-projector", p === "on" ? "on" : "off");
    } catch (e) {}
  </script>
</head>
<body class="theme-bridged" data-app-id="word-wall-maker" data-app-title="Word Wall Maker">
  <div id="app">
    <header class="head">
      <h1>Word Wall Maker</h1>
      <p class="sub">Paste words · arrange · present or print</p>
    </header>

    <section class="panel">
      <label for="title">Wall title</label>
      <input type="text" id="title" maxlength="60" value="Our Word Wall">
      <label for="words">Words (comma-separated)</label>
      <textarea id="words" rows="4" placeholder="the, and, said, because, friend…"></textarea>
      <div class="row">
        <label for="cols">Columns
          <input type="number" id="cols" min="2" max="8" value="4">
        </label>
        <label for="title-size">Title size
          <input type="range" id="title-size" min="18" max="72" value="32" aria-valuemin="18" aria-valuemax="72">
          <span id="title-size-label">32px</span>
        </label>
      </div>
      <div class="row colors">
        <label class="theme-pick">Theme
          <select id="color-theme" aria-label="Colour theme">
            <option value="custom">Custom</option>
            <option value="ocean">Ocean</option>
            <option value="sunshine">Sunshine</option>
            <option value="forest">Forest</option>
            <option value="candy">Candy</option>
            <option value="chalkboard">Chalkboard</option>
          </select>
        </label>
        <label>Title colour <input type="color" id="color-title" value="#f8fafc"></label>
        <label>Card colour <input type="color" id="color-card" value="#ffffff"></label>
        <label>Text colour <input type="color" id="color-text" value="#0f172a"></label>
        <label>Wall background <input type="color" id="color-bg" value="#1e3a5f"></label>
      </div>
      <div class="actions">
        <button type="button" class="btn primary" id="btn-build">Build wall</button>
        <button type="button" class="btn" id="btn-alpha">Sort A–Z</button>
        <button type="button" class="btn" id="btn-random">Randomize</button>
        <button type="button" class="btn" id="btn-present">Present</button>
        <button type="button" class="btn" id="btn-bank">Word Bank</button>
        <button type="button" class="btn" id="btn-print">Print</button>
        <button type="button" class="btn" id="btn-clear">Clear</button>
      </div>
    </section>

    <div id="wall" class="wall" aria-live="polite">
      <div class="wall-title" id="wall-title-el"></div>
      <div class="wall-grid" id="wall-grid"></div>
    </div>
  </div>

  <div id="word-bank" class="present" hidden>
    <div class="present-bar">
      <strong>Word Bank</strong>
      <div class="actions">
        <button type="button" class="btn" id="btn-bank-prev">← Prev</button>
        <button type="button" class="btn primary" id="btn-bank-next">Next →</button>
        <button type="button" class="btn" id="btn-bank-exit">Exit</button>
      </div>
    </div>
    <div class="bank-stage"><div id="bank-word" class="bank-word">—</div>
    <p id="bank-count" class="bank-count"></p></div>
  </div>

  <div id="present" class="present" hidden>
    <div class="present-bar">
      <button type="button" class="btn" id="btn-exit">Exit</button>
    </div>
    <div id="present-wall" class="wall present-wall">
      <div class="wall-title" id="present-title-el"></div>
      <div class="wall-grid present-grid" id="present-grid"></div>
    </div>
  </div>

  <script src="../../js/app-chrome.js"></script>
  <script src="js/app.js"></script>
  <script src="pwa-install.js"></script>
</body>
</html>
