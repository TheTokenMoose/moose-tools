<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#3b82f6">
  <meta name="description" content="Shape Builder — identify, match, rotate, count, and build with 2D and 3D shapes.">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Shape Builder — The Token Moose</title>
  <link rel="stylesheet" href="css/game.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="pwa-install.css">
</head>
<body data-app-id="shape-builder" data-app-title="Shape Builder">
  <div id="chrome-top">
  </div>

  <div id="app">
    <section id="view-home">
      <h1>Shape Builder</h1>
      <p class="tag">Build · Create · Learn</p>
      <p class="stars" id="home-stars">⭐ 0 total</p>
      <div class="mode-grid" id="mode-grid"></div>
    </section>

    <section id="view-play" hidden>
      <div class="play-bar">
        <button type="button" class="btn btn-ghost" id="btn-home">← Modes</button>
        <strong id="play-title"></strong>
        <span id="play-stars"></span>
        <button type="button" class="btn btn-ghost" id="btn-next">Next</button>
      </div>
      <div class="stage" id="stage"></div>
      <div class="toolbar" id="toolbar"></div>
      <p class="feedback" id="feedback"></p>
    </section>
  </div>

  <script src="js/shapes.js"></script>
    <script src="../../js/tts/voice-catalog.js"></script>
  <script src="../../js/tts/moose-tts.js"></script>
  <script src="../../js/voice.js"></script>
  <script src="../../js/app-chrome.js"></script>
  <script src="js/app.js"></script>
  <script src="pwa-install.js"></script>
</body>
</html>
