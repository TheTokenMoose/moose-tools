<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f97316">
  <meta name="description" content="Word Builder Factory — build CVC, blends, digraphs and silent-e words with letter tiles.">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Word Builder Factory — The Token Moose</title>
  <link rel="stylesheet" href="css/game.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="pwa-install.css">
</head>
<body data-app-id="word-builder-factory" data-app-title="Word Builder Factory">
  <div id="chrome-top">
    <div id="voice-slot" class="voice-slot"></div>
  </div>

  <div id="app">
    <section id="screen-home">
      <h1>Word Builder Factory</h1>
      <p class="tag">Picture → tiles → word</p>
      <p class="stars" id="home-stars">⭐ 0 total</p>
      <div class="level-grid" id="level-grid"></div>
    </section>

    <section id="screen-play" hidden>
      <div class="play-bar">
        <button type="button" class="btn btn-ghost" id="btn-home">← Levels</button>
        <span id="play-level"></span>
        <span id="play-stars"></span>
      </div>

      <div class="factory" id="machine">
        <div class="pic-card">
          <div class="emoji" id="pic-emoji">🐱</div>
          <button type="button" class="btn btn-ghost" id="btn-hear-word">🔊 Hear word</button>
          <p class="hi" id="highlight"></p>
          <p class="hint" id="pic-hint"></p>
        </div>
        <div class="conveyor">
          <div class="belt" id="belt"></div>
        </div>
      </div>

      <div class="tray" id="tray"></div>
      <div class="btn-row">
        <button type="button" class="btn btn-ghost" id="btn-clear">Clear</button>
        <button type="button" class="btn btn-primary" id="btn-check">Build ✓</button>
      </div>
    </section>

    <section id="screen-feedback" hidden>
      <div class="panel fb">
        <div class="fb-icon" id="fb-icon">🏭</div>
        <h2 id="fb-title">Word built!</h2>
        <p id="fb-msg"></p>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="btn-fb-next">Next</button>
          <button type="button" class="btn btn-ghost" id="btn-fb-home">Levels</button>
        </div>
      </div>
    </section>
  </div>

  <script src="js/words.js"></script>
  <script src="../../js/voice.js"></script>
  <script src="../../js/app-chrome.js"></script>
  <script src="js/app.js"></script>
  <script src="pwa-install.js"></script>
</body>
</html>
