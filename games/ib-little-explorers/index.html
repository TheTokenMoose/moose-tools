<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0B1F3A">
  <meta name="description" content="IB Little Explorers — Kindergarten ESL game inspired by the IB PYP Learner Profile.">
  <title>IB Little Explorers — The Token Moose</title>
  <link rel="stylesheet" href="css/game.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="pwa-install.css">
<style id="cover-bg-style">
.library-back { position: relative; z-index: 20; margin: 12px 16px 0; }
.library-back .btn-back {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.55rem 1rem; border-radius: 999px;
  border: 2px solid rgba(255,255,255,0.25);
  background: rgba(15, 18, 40, 0.75); color: #fff !important;
  font: inherit; font-weight: 800; font-size: 0.9rem;
  text-decoration: none !important; cursor: pointer;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  transition: transform 0.15s ease, background 0.15s ease;
}
.library-back .btn-back:hover {
  transform: translateY(-1px);
  background: rgba(30, 36, 70, 0.95); color: #fff !important;
}
.library-back .btn-back:focus-visible { outline: 2px solid #22d3ee; outline-offset: 2px; }

    /* Cover art page background */
    body {
      background-color: #0a0b1a;
      background-image:
        linear-gradient(180deg, rgba(8, 10, 24, 0.55) 0%, rgba(8, 10, 24, 0.78) 45%, rgba(8, 10, 24, 0.92) 100%),
        url("../../assets/screenshots/ib-little-explorers.jpg");
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>
<body data-app-id="ib-little-explorers" data-app-title="IB Little Explorers">
  <div id="game-wrap">
    <canvas id="game" width="1920" height="1080" aria-label="IB Little Explorers game canvas"></canvas>
  </div>
  <noscript>
    <p style="color:#fff;text-align:center;padding:2rem;font-family:sans-serif;">
      IB Little Explorers needs JavaScript enabled to play.
    </p>
  </noscript>
  <script src="../../js/tts/voice-catalog.js"></script>
  <script src="../../js/tts/moose-tts.js"></script>
  <script src="../../js/voice.js"></script>
  <script type="module" src="js/game.js"></script>

  <div id="pwa-install-bar" hidden>
    <div class="pwa-install-text">
      <strong>Install IB Little Explorers</strong>
      <span>Add this app to your device for offline play.</span>
    </div>
    <button type="button" id="pwa-install-btn">Install</button>
    <button type="button" id="pwa-install-dismiss" aria-label="Dismiss">×</button>
  </div>

  <script src="pwa-install.js"></script>
  <script src="../../js/app-chrome.js"></script>
</body>
</html>
