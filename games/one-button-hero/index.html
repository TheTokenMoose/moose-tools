<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#16213e">
  <meta name="description" content="One Button Hero: The Duckening — one-button action platformer.">
  <title>One Button Hero — The Token Moose</title>
  <link rel="stylesheet" href="css/game.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="pwa-install.css">

  /* Cover art page background */
  <style id="cover-bg-style">
    body {
      background-color: #0a0b1a;
      background-image:
        linear-gradient(180deg, rgba(8, 10, 24, 0.55) 0%, rgba(8, 10, 24, 0.78) 45%, rgba(8, 10, 24, 0.92) 100%),
        url("../../assets/screenshots/one-button-hero.jpg");
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>
<body>
  <p class="library-back" style="position:absolute;z-index:5;margin:8px 12px;"><a href="../../index.html" style="color:#a5b4fc;font-weight:600;text-decoration:none;font-family:system-ui,sans-serif;">← Back to The Token Moose</a></p>

  <div id="game-wrap">
    <canvas id="game" width="1920" height="1080" aria-label="One Button Hero game canvas"></canvas>
  </div>
  <noscript>
    <p style="color:#fff;text-align:center;padding:2rem;font-family:monospace;">
      One Button Hero needs JavaScript enabled to play.
    </p>
  </noscript>
  <script src="js/game.js"></script>

  <div id="pwa-install-bar" hidden>
    <div class="pwa-install-text">
      <strong>Install One Button Hero</strong>
      <span>Add this app to your device for offline play.</span>
    </div>
    <button type="button" id="pwa-install-btn">Install</button>
    <button type="button" id="pwa-install-dismiss" aria-label="Dismiss">×</button>
  </div>

  <script src="pwa-install.js"></script>
</body>
</html>
