<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FF6B35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vowel Quest">
  <meta name="description" content="Practice vowel letters and their common English sounds through short touch-friendly mini-games. Short/long vowels, R-controlled, and more — built for kindergarten and early primary phonics on large touch displays.">
  <title>Vowel Quest — The Token Moose</title>
  <link rel="icon" href="../../assets/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../css/themes.css">
  <link rel="stylesheet" href="../../css/theme-app.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="pwa-install.css">
</head>
<body data-app-id="vowel-quest" data-app-title="Vowel Quest">
  <!-- HOME / VOWEL SELECT -->
  <div id="home" class="screen active">
    <div class="bg-bubbles">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="home-content">
      <h1 class="app-title">Vowel Quest</h1>
      <p class="tagline">Choose a vowel to practice</p>
      <div class="vowel-grid" id="vowelGrid"></div>
      <div class="home-stats">
        <div class="stat">
          <span class="stat-num" id="highScore">0</span>
          <span class="stat-label">Best Score</span>
        </div>
      </div>
    </div>
  </div>

  <!-- SOUND SELECT (per vowel) -->
  <div id="select" class="screen">
    <div class="select-content">
      <button id="backHomeBtn" class="icon-btn back-btn" title="Back" type="button">←</button>
      <div class="select-vowel-badge" id="selectVowelBadge">O</div>
      <h2 class="select-title" id="selectTitle">Choose a sound</h2>
      <p class="select-hint" id="selectHint">Pick one sound or play them all</p>
      <div class="sound-grid" id="soundGrid"></div>
      <div class="select-actions">
        <button id="playAllBtn" class="btn secondary" type="button">Play All Sounds</button>
        <button id="advancedBtn" class="btn accent" type="button">
          <span>🌈</span> Advanced Mix
        </button>
      </div>
    </div>
  </div>

  <!-- GAME -->
  <div id="game" class="screen">
    <header class="game-header">
      <button id="homeBtn" class="icon-btn" title="Home" type="button">🏠</button>
      <div class="score-box">
        <span class="score-label">Score</span>
        <span id="score">0</span>
      </div>
      <div class="level-box">
        <span class="level-label">Round</span>
        <span id="level">1</span>
      </div>
      <button id="soundBtn" class="icon-btn" title="Sound on/off" type="button">🔊</button>
    </header>
    <div class="sound-badge" id="soundBadge">Short O</div>
    <div id="activity-area" class="activity-area"></div>
    <div class="progress-bar">
      <div id="progress" class="progress-fill"></div>
    </div>
  </div>

  <!-- Celebration -->
  <div id="celebration" class="overlay hidden">
    <div class="celeb-content">
      <div class="stars">⭐ ✨ 🌟</div>
      <h2 id="celeb-title">Awesome!</h2>
      <p id="celeb-msg">You found them all!</p>
      <div class="big-score">+<span id="celeb-points">10</span></div>
      <button id="nextBtn" class="btn primary" type="button">Next Round →</button>
    </div>
  </div>

  <!-- Final -->
  <div id="final" class="screen">
    <div class="final-content">
      <div class="trophy">🏆</div>
      <h2>You did it!</h2>
      <p class="final-score">Score: <span id="finalScore">0</span></p>
      <p class="encouragement" id="finalMsg">Great work!</p>
      <button id="playAgainBtn" class="btn primary" type="button">Play Again 🔄</button>
      <button id="homeFromFinal" class="btn secondary" type="button">Home</button>
    </div>
  </div>

  <div id="pwa-install-bar" hidden>
    <div class="pwa-install-text">
      <strong>Install Vowel Quest</strong>
      <span>Add this app to your device for offline play.</span>
    </div>
    <button type="button" id="pwa-install-btn">Install</button>
    <button type="button" id="pwa-install-dismiss" aria-label="Dismiss">×</button>
  </div>

  <!-- Shared TTS (system voices + optional Piper) -->
  <script src="../../js/tts/voice-catalog.js"></script>
  <script src="../../js/tts/moose-tts.js"></script>
  <script src="../../js/voice.js"></script>
  <script src="js/app.js"></script>
  <script src="pwa-install.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/app-chrome.js"></script>
</body>
</html>
