<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Simple Machines Lab — open physics sandboxes for lever, pulley, ramp, wheel, wedge, and screw.">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Simple Machines Lab — The Token Moose</title>
  <link rel="stylesheet" href="css/game.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="pwa-install.css">
</head>
<body data-app-id="simple-machines" data-app-title="Simple Machines Lab">
  <div id="app">
    <section id="view-lab" class="view">
      <header class="lab-head">
        <h1>Simple Machines Lab</h1>
        <p class="tag">Open sandboxes · drag · drop · experiment</p>
        <p class="tip">No scores. Just play and see what happens.</p>
      </header>
      <div class="station-grid" id="station-grid"></div>
    </section>

    <section id="view-sandbox" class="view" hidden>
      <div class="sandbox-bar">
        <button type="button" class="btn btn-ghost" id="btn-lab">← Lab</button>
        <h2 id="sb-title"></h2>
        <button type="button" class="btn btn-ghost" id="btn-hear" title="Hear tip">🔊 Tip</button>
        <button type="button" class="btn btn-ghost" id="btn-reset">Reset</button>
      </div>
      <p class="challenge-line" id="sb-tip"></p>
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="world"></canvas>
      </div>
      <div class="toolbar" id="sb-toolbar"></div>
    </section>
  </div>

  <script src="vendor/matter.min.js"></script>
  <script src="../../js/voice.js"></script>
  <script src="../../js/app-chrome.js"></script>
  <script src="js/game.js"></script>
  <script src="pwa-install.js"></script>
</body>
</html>
