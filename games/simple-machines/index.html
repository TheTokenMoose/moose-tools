<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Simple Machines Lab — six clear experiments for young learners. Lever, pulley, ramp, wheel, wedge, screw.">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Simple Machines Lab — The Token Moose</title>
  <link rel="stylesheet" href="css/game.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="pwa-install.css">
</head>
<body data-app-id="simple-machines" data-app-title="Simple Machines Lab">
  <div id="app">
    <!-- LAB -->
    <section id="view-lab" class="view">
      <header class="lab-head">
        <h1>Simple Machines Lab</h1>
        <p class="tag">Tap a machine. Do the challenge. See what happens!</p>
        <p class="progress" id="lab-progress">0 / 6 machines complete</p>
        <button type="button" class="btn btn-ghost" id="btn-expert" hidden>🌟 Expert badge</button>
      </header>
      <div class="station-grid" id="station-grid"></div>
    </section>

    <!-- PLAY -->
    <section id="view-play" class="view" hidden>
      <div class="play-bar">
        <button type="button" class="btn btn-ghost" id="btn-back">← Lab</button>
        <button type="button" class="btn btn-ghost" id="btn-reset">Reset</button>
      </div>
      <div class="play-head">
        <span class="play-icon" id="play-icon"></span>
        <h2 id="play-name"></h2>
      </div>
      <p class="intro-line" id="play-intro"></p>
      <p class="challenge-line" id="play-challenge"></p>
      <div class="play-stage" id="play-stage"></div>
    </section>

    <!-- SUCCESS -->
    <section id="view-success" class="view" hidden>
      <div class="card">
        <div class="success-icon" id="success-icon">⭐</div>
        <h2 id="success-title">Great job!</h2>
        <p class="success-msg" id="success-msg"></p>
        <p class="progress" id="success-progress"></p>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="btn-again">Try again</button>
          <button type="button" class="btn btn-primary" id="btn-next">Next machine</button>
          <button type="button" class="btn btn-ghost" id="btn-to-lab">Back to Lab</button>
        </div>
      </div>
    </section>

    <!-- EXPERT -->
    <section id="view-expert" class="view" hidden>
      <div class="card">
        <h2>🌟 Simple Machines Expert!</h2>
        <p class="success-msg">You tried all six machines.</p>
        <ul id="expert-list" class="expert-list"></ul>
        <button type="button" class="btn btn-primary" id="btn-expert-lab">Back to Lab</button>
      </div>
    </section>
  </div>

  <script src="../../js/app-chrome.js"></script>
  <script src="js/game.js"></script>
  <script src="pwa-install.js"></script>
</body>
</html>
