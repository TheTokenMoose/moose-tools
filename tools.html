<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Small teacher tools from The Token Moose — classroom helpers that run in the browser.">
  <meta name="theme-color" content="#0a0b1a">
  <title>Tools — Moose Tools</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/icons/favicon-180.png">
<link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/themes.css">
  <script>
    try {
      var t = localStorage.getItem("token-moose-theme");
      if (t === "day" || t === "playful" || t === "night" || t === "forest") {
        document.documentElement.setAttribute("data-theme", t);
      }
      var p = localStorage.getItem("token-moose-projector");
      document.documentElement.setAttribute("data-projector", p === "on" ? "on" : "off");
    } catch (e) {}
  </script>
</head>
<body data-page="tools">
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand" aria-label="The Token Moose home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>THE TOKEN MOOSE</span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav">
        <span></span>
      </button>
      <nav id="main-nav" class="main-nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="tools.html" aria-current="page">Tools</a>
        <a href="favorites.html">Favorites</a>
        <a href="voice-settings.html">Voices</a>
        <a href="about.html">About</a>
      </nav>
          <div class="theme-switcher">
        <button type="button" class="theme-ball" id="theme-ball" aria-haspopup="listbox" aria-expanded="false" aria-controls="theme-menu" title="Change theme" aria-label="Themes"></button>
        <button type="button" class="theme-label-btn" id="theme-label-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="theme-menu">Themes</button>
        <div class="theme-menu" id="theme-menu" role="listbox" aria-label="Site theme" hidden>
          <button type="button" class="theme-option" role="option" data-theme="night" aria-checked="false">
            <span class="theme-swatch night" aria-hidden="true"></span>
            <span class="theme-option-text">Night City<small>Soft neon · default</small></span>
          </button>
          <button type="button" class="theme-option" role="option" data-theme="day" aria-checked="false">
            <span class="theme-swatch day" aria-hidden="true"></span>
            <span class="theme-option-text">Daylight<small>Bright · airy · calm</small></span>
          </button>
          <button type="button" class="theme-option" role="option" data-theme="playful" aria-checked="false">
            <span class="theme-swatch playful" aria-hidden="true"></span>
            <span class="theme-option-text">Preschool Playful<small>Warm · candy · energetic</small></span>
          </button>
        </div>
      </div>
</div>
  </header>

  <main class="site-main">
    <section aria-labelledby="tools-heading">
      <div class="section-header">
        <div>
          <h2 id="tools-heading">Teacher Tools</h2>
          <p class="page-intro">Small classroom helpers and utilities. Some can be installed as apps for quick access.</p>
        </div>
      </div>

      <div class="toolbar">
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <label for="search-input" class="sr-only">Search tools</label>
          <input type="search" id="search-input" placeholder="Search tools…" autocomplete="off">
        </div>
        <div class="filter-group" role="group" aria-label="Filter">
          <button type="button" class="filter-btn is-active" data-filter="tools" aria-pressed="true">All Tools</button>
          <button type="button" class="filter-btn" data-filter="favorites" aria-pressed="false">Favorites</button>
              <button type="button" class="filter-btn" data-tags-toggle aria-pressed="true" title="Show or hide skill tags on cards">Tags on</button>
        </div>
      </div>

      <div id="project-grid" class="project-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Moose Tools · Open source · Made for learning and play</p>
  </footer>

  <script src="js/projects.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/install.js"></script>
  <script src="js/app.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/sw-register.js"></script>
</body>
</html>
